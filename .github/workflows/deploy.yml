name: Test, Build and Push

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for testing
        run: |
          cat <<EOF > .env
          SERVER_PORT=3000
          SPRING_APPLICATION_NAME=spring-app
          SPRING_DATASOURCE_URL=${{ secrets.SUPABASE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SUPABASE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SUPABASE_PASS }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          SPRING_JPA_SHOW_SQL=false
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          SECURITY_JWT_SECRET_KEY=${{ secrets.SECURITY_JWT_SECRET_KEY }}
          SECURITY_JWT_EXPIRATION_TIME=86400000
          EOF

      - name: Build and run (pre-develop)
        run: docker compose -f docker-compose.predevelop.yml up --build -d

      - name: Wait and check health
        run: sleep 15 && curl --fail http://localhost:3000/actuator/health || (docker compose -f docker-compose.predevelop.yml logs && exit 1)

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.predevelop.yml down

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

